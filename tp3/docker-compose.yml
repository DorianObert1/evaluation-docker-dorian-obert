services:
  # Base de données PostgreSQL
  db:
    image: postgres:15-alpine
    container_name: eval-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - eval-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Interface Adminer
  adminer:
    image: adminer:latest
    container_name: eval-adminer
    ports:
      - "8080:8080"
    depends_on:
      - db
    networks:
      - eval-network

  # Cache Redis
  redis:
    image: redis:7-alpine
    container_name: eval-redis
    volumes:
      - redis-data:/data
    networks:
      - eval-network

  # API Node.js
  api:
    build: ./api
    container_name: eval-api
    environment:
      DB_HOST: db
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: ${POSTGRES_DB}
      REDIS_HOST: redis
      PORT: ${API_PORT}
    ports:
      - "${API_PORT}:3000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - eval-network
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Reverse Proxy Nginx
  nginx:
    image: nginx:alpine
    container_name: eval-nginx
    ports:
      - "8081:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/index.html:/usr/share/nginx/html/index.html:ro
    depends_on:
      - api
    networks:
      - eval-network

networks:
  eval-network:
    driver: bridge

volumes:
  db-data:
  redis-data:

